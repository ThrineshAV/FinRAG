version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - rag-net

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-test-secret-key-at-least-32-chars-long!!}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
    depends_on:
      - redis
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge
